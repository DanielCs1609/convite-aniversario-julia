<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hand-drawn style blue flower -->
  <g stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem/leaves -->
    <path d="M 50,55 L 50,90" fill="none" stroke="#7A8B60" stroke-width="1.5" />
    <path d="M 50,75 Q 35,70 30,60" fill="none" stroke="#7A8B60" stroke-width="1.5" />
    <path d="M 50,80 Q 65,75 70,68" fill="none" stroke="#7A8B60" stroke-width="1.5" />
    
    <!-- Petals -->
    <path d="M 50,50 C 45,35 35,40 30,45 C 38,50 45,48 50,50 Z" fill="#1E4E79" />
    <path d="M 50,50 C 40,25 50,20 55,30 C 52,38 52,45 50,50 Z" fill="#1E4E79" />
    <path d="M 50,50 C 65,35 60,45 68,52 C 58,52 52,50 50,50 Z" fill="#1E4E79" />
    <path d="M 50,50 C 55,65 65,60 70,55 C 62,50 55,52 50,50 Z" fill="#1E4E79" />
    <path d="M 50,50 C 40,65 30,60 25,55 C 32,50 42,52 50,50 Z" fill="#1E4E79" />
    
    <!-- Center -->
    <circle cx="50" cy="50" r="4" fill="#E8BE6B" />
  </g>
</svg>
