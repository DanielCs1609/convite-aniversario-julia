<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 200" width="250" height="200">
  <!-- Hand-drawn scene: sailboat on Lago Paranoá at sunset/afternoon -->
  <g stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Warm Sun -->
    <path d="M 125,75 A 35,35 0 1,1 125,74.9" fill="#E8BE6B" stroke="none" opacity="0.8" />
    <!-- Sunrays (hand-drawn lines) -->
    <path d="M 125,25 L 125,35" stroke="#E8BE6B" stroke-width="2" />
    <path d="M 125,115 L 125,125" stroke="#E8BE6B" stroke-width="2" />
    <path d="M 75,75 L 85,75" stroke="#E8BE6B" stroke-width="2" />
    <path d="M 165,75 L 175,75" stroke="#E8BE6B" stroke-width="2" />
    <path d="M 90,40 L 98,48" stroke="#E8BE6B" stroke-width="2" />
    <path d="M 160,40 L 152,48" stroke="#E8BE6B" stroke-width="2" />
    
    <!-- Waves (Lago Paranoá) -->
    <path d="M 20,120 Q 50,110 80,120 T 140,120 T 200,120 T 230,120" stroke="#1E4E79" stroke-width="1.8" />
    <path d="M 10,135 Q 40,125 70,135 T 130,135 T 190,135 T 240,135" stroke="#1E4E79" stroke-width="1.2" opacity="0.7" />
    <path d="M 30,150 Q 60,140 90,150 T 150,150 T 210,150" stroke="#1E4E79" stroke-width="1.2" opacity="0.5" />
    
    <!-- Sailboat -->
    <g transform="translate(10, -5)">
      <!-- Boat Hull -->
      <path d="M 90,120 L 140,120 L 148,110 L 85,110 Z" fill="#FBF8F3" stroke="#1A1A1A" stroke-width="1.8" />
      <!-- Mast -->
      <path d="M 115,110 L 115,65" stroke="#1A1A1A" stroke-width="2" />
      <!-- Main Sail -->
      <path d="M 117,70 L 142,103 L 117,103 Z" fill="#FAF7F2" stroke="#1A1A1A" stroke-width="1.8" />
      <!-- Jib (front sail) -->
      <path d="M 113,72 L 93,103 L 113,103 Z" fill="#DDA4A5" stroke="#1A1A1A" stroke-width="1.5" />
      <!-- Small flag -->
      <path d="M 115,65 L 123,68 L 115,71 Z" fill="#6E2E39" stroke="none" />
    </g>

    <!-- Botanical decoration framing the bottom right -->
    <g transform="translate(180, 120) scale(0.6)">
      <!-- Leaf stems -->
      <path d="M 10,80 C 15,60 30,20 50,10" stroke="#7A8B60" stroke-width="2" />
      <path d="M 20,50 Q 5,45 2,35 C 5,30 15,40 20,50" fill="#7A8B60" />
      <path d="M 35,32 Q 45,15 38,10 C 32,15 30,25 35,32" fill="#2D3E25" />
      <!-- Small pink buds -->
      <circle cx="50" cy="10" r="6" fill="#DDA4A5" />
      <circle cx="42" cy="0" r="5" fill="#DDA4A5" />
    </g>
    
    <!-- Botanical decoration framing the bottom left -->
    <g transform="translate(20, 110) scale(0.5) rotate(-15)">
      <!-- Stem -->
      <path d="M 20,90 L 20,40" stroke="#7A8B60" stroke-width="2" />
      <!-- Leaves -->
      <path d="M 20,70 Q 5,65 5,55" stroke="#7A8B60" />
      <path d="M 20,60 Q 35,55 35,45" stroke="#7A8B60" />
      <!-- Yellow flower -->
      <circle cx="20" cy="35" r="8" fill="#E8BE6B" />
      <circle cx="12" cy="28" r="5" fill="#FAF7F2" />
      <circle cx="28" cy="28" r="5" fill="#FAF7F2" />
      <circle cx="20" cy="45" r="5" fill="#FAF7F2" />
      <circle cx="20" cy="35" r="3" fill="#DF8C6E" />
    </g>
  </g>
</svg>
